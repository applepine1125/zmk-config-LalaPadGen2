# BLE
CONFIG_BT_BAS=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#XIAO
CONFIG_NFCT_PINS_AS_GPIOS=y

#Trackpad
CONFIG_I2C=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_INPUT_IQS9151=y
CONFIG_INPUT_THREAD_STACK_SIZE=4096
# BLE送信待ちで input キューが溢れて REL/ボタン離しが捨てられるのを防ぐ
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=2000

#ZMKSLEEP
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

#RGBLEDWIDGET
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y

#CHGLED
CONFIG_ZMK_EASY_CHARGE_INDICATOR=y

#STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#TRACKPAD TUNER (tools/tp-tuner)
# USB CDC 上の Zephyr shell で tp コマンドを使う。ZMK_USB_LOGGING とは
# 同じ CDC(zephyr,console)を取り合うので併用しない
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BUFFER_SIZE=4096
# 左右ともログ処理スレッドが 50ms ごとに起きる(trace の遅延を抑える代わりに電池を消費する)
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_INPUT_IQS9151_LOG_LEVEL=3
CONFIG_INPUT_IQS9151_SHELL=y
# SENSOR_SHELL が CBPRINTF_FP_SUPPORT を y-select し CBPRINTF_COMPLETE=n と
# 衝突するため明示的に無効化
CONFIG_SENSOR_SHELL=n
# 実機で左手の split BLE リンクに詰まりが見られたため、ペリフェラルが接続イベントを飛ばさないようにする実験。電池持ちとのトレードオフ
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
# キーとトラックパッドの通知が同じ BLE 送信バッファを取り合ってキー入力がまとまって届くため、
# 1 接続イベントで送れる量を増やす実験。RAM を数 KB 使う
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# 実機で 16ms が有効だったため既定に(左右両方のビルドに適用される)
CONFIG_INPUT_IQS9151_CURSOR_REPORT_INTERVAL_MS=16

#Debug only (ZMK_USB_LOGGING は上の shell と排他)
#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_INPUT_LOG_LEVEL_DBG=y
#CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

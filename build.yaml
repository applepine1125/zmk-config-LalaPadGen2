---
include:
  - board: seeeduino_xiao_ble
    shield: lalapadgen2_right rgbled_adapter
    snippet: studio-rpc-usb-uart
  - board: seeeduino_xiao_ble
    shield: lalapadgen2_left rgbled_adapter
  - board: seeeduino_xiao_ble
    shield: settings_reset

  # トラックパッド感度プロファイル(実機比較用)。conf の既定値との差分だけを cmake-args で上書きする
  # mid: 信号増し(ATI 600)+低消費電力時のサンプリング短縮で立ち上がりを改善
  - board: seeeduino_xiao_ble
    shield: lalapadgen2_right rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: lalapadgen2_right-sens_mid
    cmake-args: -DCONFIG_INPUT_IQS9151_ATI_TARGETCOUNT=600 -DCONFIG_INPUT_IQS9151_TOUCH_SET_THRESHOLD=30 -DCONFIG_INPUT_IQS9151_TOUCH_CLEAR_THRESHOLD=24 -DCONFIG_INPUT_IQS9151_IDLE_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_LP1_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_LP2_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_ALP_SET_DEBOUNCE=1
  - board: seeeduino_xiao_ble
    shield: lalapadgen2_left rgbled_adapter
    artifact-name: lalapadgen2_left-sens_mid
    cmake-args: -DCONFIG_INPUT_IQS9151_ATI_TARGETCOUNT=600 -DCONFIG_INPUT_IQS9151_TOUCH_SET_THRESHOLD=30 -DCONFIG_INPUT_IQS9151_TOUCH_CLEAR_THRESHOLD=24 -DCONFIG_INPUT_IQS9151_IDLE_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_LP1_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_LP2_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_ALP_SET_DEBOUNCE=1
  # high: さらに信号増し(ATI 800)+閾値を下げ、指の信頼度閾値を上げてゴーストタッチを抑える
  - board: seeeduino_xiao_ble
    shield: lalapadgen2_right rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: lalapadgen2_right-sens_high
    cmake-args: -DCONFIG_INPUT_IQS9151_ATI_TARGETCOUNT=800 -DCONFIG_INPUT_IQS9151_TOUCH_SET_THRESHOLD=26 -DCONFIG_INPUT_IQS9151_TOUCH_CLEAR_THRESHOLD=20 -DCONFIG_INPUT_IQS9151_IDLE_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_LP1_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_LP2_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_ALP_SET_DEBOUNCE=1 -DCONFIG_INPUT_IQS9151_FINGER_CONFIDENCE_THRESHOLD=30
  - board: seeeduino_xiao_ble
    shield: lalapadgen2_left rgbled_adapter
    artifact-name: lalapadgen2_left-sens_high
    cmake-args: -DCONFIG_INPUT_IQS9151_ATI_TARGETCOUNT=800 -DCONFIG_INPUT_IQS9151_TOUCH_SET_THRESHOLD=26 -DCONFIG_INPUT_IQS9151_TOUCH_CLEAR_THRESHOLD=20 -DCONFIG_INPUT_IQS9151_IDLE_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_LP1_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_LP2_MODE_SAMPLING_PERIOD_MS=20 -DCONFIG_INPUT_IQS9151_ALP_SET_DEBOUNCE=1 -DCONFIG_INPUT_IQS9151_FINGER_CONFIDENCE_THRESHOLD=30

name: Keymap image

on:
  push:
    branches: [main]
  pull_request:

jobs:
  keymap-image:
    name: keymap-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install librsvg
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Run tests
        run: python3 -m unittest discover -s tools/keymap-img

      - name: Render keymap images
        run: python3 tools/keymap-img/render.py

      - name: Check images are in sync with keymap
        run: |
          if ! git diff --exit-code -- 'docs/keymap/*.svg' tools/keymap-img/template.svg; then
            echo "::error::docs/keymap の画像が keymap と同期していません。'python3 tools/keymap-img/render.py' を実行してコミットしてください。"
            exit 1
          fi

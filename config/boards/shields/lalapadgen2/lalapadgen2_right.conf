# tp-tuner の stream 通知(右手のみ)。ATT MTU は min(BT_L2CAP_RX_MTU, BT_L2CAP_TX_MTU) で決まり、
# Zephyr 3.5 の既定(BT_SMP 時 65)のままだと通知が 62 バイトずつになる。ライブ表示(T F 行 約 50 バイト)を
# 1 通知に複数行まとめて送れるよう 247 に広げる(L2CAP TX バッファ 10 本 × 約 180 バイトの RAM 増)。
# command の 64 バイト書き込みも長い書き込み(BT_ATT_PREPARE_COUNT=0 で非対応)に頼らず 1 回で届く。
# 左手の split リンクは MTU 交換をしないので左手には不要
CONFIG_BT_L2CAP_TX_MTU=247
